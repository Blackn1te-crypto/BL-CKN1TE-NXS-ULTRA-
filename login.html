<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BL@CKN1TE-NXS-ULTRA · Access Terminal</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Blackn1te-crypto/BLACKN1TE-NXS/main/logo.png">
    <meta name="theme-color" content="#05070d">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dim: #00cc7a;
            --accent: #7c3aed;
            --accent-2: #06b6d4;
            --bg: #05070d;
            --bg-2: #0a0f1a;
            --text: #e6f1ff;
            --muted: #6b7a90;
            --border: rgba(0, 255, 157, 0.15);
            --danger: #ff3b5c;
            --warning: #ffb020;
            --grad: linear-gradient(135deg, #00ff9d 0%, #06b6d4 50%, #7c3aed 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════ CINEMATIC INTRO ═══════════════ */
        #cinemaIntro {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle at 50% 50%, #0a0f1a 0%, #05070d 60%, #000 100%);
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        #cinemaIntro.hide {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }

        .cine-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 157, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 20s linear infinite;
            opacity: 0;
            animation: gridScroll 20s linear infinite, cineGridIn 2s 0.3s ease-out forwards;
            pointer-events: none;
        }
        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }
        @keyframes cineGridIn {
            to { opacity: 1; }
        }

        .cine-scan {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 30%, rgba(0, 255, 157, 0.08) 50%, transparent 70%);
            animation: scanPulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes scanPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .cine-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            animation: scanLine 3s linear infinite;
            opacity: 0.7;
        }
        @keyframes scanLine {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .cine-bolts {
            position: absolute; inset: 0;
            pointer-events: none;
            opacity: 0.9;
        }
        .cine-bolt {
            stroke: #00ff9d;
            stroke-width: 1.5;
            fill: none;
            filter: drop-shadow(0 0 8px #00ff9d) drop-shadow(0 0 20px #06b6d4);
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: cineBoltFlash 4s ease-in-out infinite;
        }
        .cine-bolt.b1 { animation-delay: 0.5s; stroke: #00ff9d; }
        .cine-bolt.b2 { animation-delay: 2s; stroke: #7c3aed; filter: drop-shadow(0 0 10px #7c3aed); }
        .cine-bolt.b3 { animation-delay: 3s; stroke: #06b6d4; }
        @keyframes cineBoltFlash {
            0%, 100% { opacity: 0; stroke-dashoffset: 500; }
            44% { opacity: 0; stroke-dashoffset: 500; }
            46% { opacity: 1; stroke-dashoffset: 0; }
            48% { opacity: 0.3; stroke-dashoffset: 0; }
            50% { opacity: 1; stroke-dashoffset: 0; }
            55% { opacity: 0; stroke-dashoffset: -500; }
        }

        .cine-particles {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            animation: particleFloat 6s linear infinite;
            opacity: 0.7;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0.4); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        .cine-logo-wrap {
            position: relative;
            width: 180px; height: 180px;
            opacity: 0;
            transform: scale(0.3);
            animation: logoReveal 2.2s 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            z-index: 3;
        }
        @keyframes logoReveal {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); filter: blur(20px); }
            60% { opacity: 1; transform: scale(1.08) rotate(3deg); filter: blur(0); }
            100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
        }

        .cine-ring-1, .cine-ring-2, .cine-ring-3 {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .cine-ring-1 {
            inset: -20px;
            border-top-color: var(--primary);
            border-right-color: var(--accent-2);
            animation: spin 1.8s linear infinite;
            filter: drop-shadow(0 0 10px var(--primary));
        }
        .cine-ring-2 {
            inset: -40px;
            border-bottom-color: var(--accent);
            border-left-color: var(--primary);
            animation: spin 3s linear infinite reverse;
            opacity: 0.7;
        }
        .cine-ring-3 {
            inset: -60px;
            border: 1px dashed rgba(0, 255, 157, 0.4);
            animation: spin 6s linear infinite;
            opacity: 0.5;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .cine-logo {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 40px;
            overflow: hidden;
            border: 3px solid rgba(0, 255, 157, 0.6);
            box-shadow:
                0 0 40px rgba(0, 255, 157, 0.8),
                0 0 80px rgba(6, 182, 212, 0.5),
                inset 0 0 40px rgba(0, 255, 157, 0.2);
            animation: logoGlow 2s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 157, 0.8), 0 0 80px rgba(6, 182, 212, 0.5); }
            50% { box-shadow: 0 0 60px rgba(0, 255, 157, 1), 0 0 120px rgba(6, 182, 212, 0.7); }
        }
        .cine-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .cine-brand {
            position: absolute;
            top: calc(50% + 130px);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90vw;
            max-width: 500px;
            z-index: 3;
        }
        .cine-brand-main {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #00ff9d, #06b6d4, #7c3aed, #00ff9d);
            background-size: 300% auto;
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: brandIn 1.2s 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, shine 4s linear infinite;
            filter: drop-shadow(0 0 20px rgba(0, 255, 157, 0.5));
        }
        .cine-brand-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 8px;
            color: var(--primary);
            margin-top: 14px;
            opacity: 0;
            transform: translateY(15px);
            animation: brandIn 1.2s 2s ease-out forwards;
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.8);
        }
        .cine-brand-sub {
            font-size: 0.62rem;
            letter-spacing: 4px;
            color: var(--muted);
            margin-top: 6px;
            opacity: 0;
            transform: translateY(10px);
            animation: brandIn 1.2s 2.3s ease-out forwards;
        }
        @keyframes brandIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .cine-loader {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            max-width: 80vw;
            opacity: 0;
            animation: brandIn 0.8s 2.6s ease-out forwards;
            z-index: 3;
        }
        .cine-loader-label {
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--primary);
            margin-bottom: 10px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.8);
        }
        .cine-loader-track {
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 157, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: inset 0 0 10px rgba(0, 255, 157, 0.1);
        }
        .cine-loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff9d, #06b6d4, #7c3aed);
            background-size: 200% auto;
            box-shadow: 0 0 15px var(--primary);
            animation: loaderFill 2.8s 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards, shine 2s linear infinite;
        }
        @keyframes loaderFill {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 45%; }
            75% { width: 78%; }
            100% { width: 100%; }
        }

        /* ═══════════════ LOGIN SCREEN ═══════════════ */
        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loginScreen.show {
            opacity: 1;
            visibility: visible;
        }

        .login-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15), transparent 45%),
                        radial-gradient(circle at 80% 70%, rgba(0, 255, 157, 0.12), transparent 45%),
                        var(--bg);
            z-index: 0;
        }
        .login-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 45px 45px;
            animation: gridScroll 25s linear infinite;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg, rgba(15, 20, 32, 0.92), rgba(10, 15, 26, 0.85));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 157, 0.25);
            border-radius: 24px;
            padding: 40px 30px 34px;
            box-shadow:
                0 0 60px rgba(0, 255, 157, 0.15),
                inset 0 0 60px rgba(0, 255, 157, 0.03);
            animation: cardFloat 5s ease-in-out infinite;
        }
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
            border-radius: 2px;
            animation: topLine 3s ease-in-out infinite;
        }
        @keyframes topLine {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; box-shadow: 0 0 20px var(--primary); }
        }

        .login-logo-wrap {
            position: relative;
            width: 90px; height: 90px;
            margin: 0 auto 22px;
        }
        .login-logo-ring {
            position: absolute;
            inset: -10px;
            border-radius: 28px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #00ff9d, #06b6d4, #7c3aed, #00ff9d) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 255, 157, 0.5));
        }
        .login-logo {
            width: 100%; height: 100%;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 157, 0.4);
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.5);
        }
        .login-logo img { width: 100%; height: 100%; object-fit: cover; }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-align: center;
            background: linear-gradient(90deg, #00ff9d, #06b6d4, #7c3aed, #00ff9d);
            background-size: 300% auto;
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(0, 255, 157, 0.5));
        }
        .login-sub {
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: var(--muted);
            text-align: center;
            margin-top: 8px;
            margin-bottom: 32px;
            text-transform: uppercase;
        }

        .input-field {
            margin-bottom: 18px;
            position: relative;
        }
        .input-field label {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(0, 255, 157, 0.2);
            border-radius: 12px;
            transition: 0.25s;
            overflow: hidden;
        }
        .input-wrap:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.12), 0 0 25px rgba(0, 255, 157, 0.2);
        }
        .input-wrap i.input-icon {
            padding: 0 14px;
            color: var(--primary);
            font-size: 0.95rem;
            opacity: 0.7;
            filter: drop-shadow(0 0 6px rgba(0, 255, 157, 0.5));
        }
        .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 16px 18px 16px 0;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92rem;
            letter-spacing: 1px;
        }
        .input-wrap input::placeholder { color: rgba(107, 122, 144, 0.5); }
        .input-toggle {
            padding: 0 16px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .input-toggle:hover { color: var(--primary); }

        .btn-login {
            width: 100%;
            padding: 17px 24px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ff9d 0%, #06b6d4 55%, #0088ff 100%);
            color: #05070d;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.88rem;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.4), inset 0 -3px 0 rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.7), 0 8px 30px rgba(6,182,212,0.5);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-login::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: btnShine 3s linear infinite;
        }
        @keyframes btnShine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 157, 0.1);
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--muted);
        }
        .login-footer .tagline {
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.6);
        }

        .shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .login-error {
            display: none;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: rgba(255, 59, 92, 0.08);
            border: 1px solid rgba(255, 59, 92, 0.35);
            border-left: 3px solid var(--danger);
            border-radius: 10px;
            color: var(--danger);
            font-size: 0.75rem;
            letter-spacing: 1px;
            animation: brandIn 0.3s ease-out;
        }
        .login-error.show { display: block; }
        .login-error i { margin-right: 8px; }

        .toast-container {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 18px;
            min-width: 240px;
            background: #05070d;
            border: 1px solid var(--primary);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            color: #fff;
            font-size: 0.78rem;
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast.success { border-color: var(--success, #00ff9d); border-left-color: var(--success, #00ff9d); }
        .toast.error { border-color: var(--danger); border-left-color: var(--danger); }
        .toast.success i { color: var(--primary); }
        .toast.error i { color: var(--danger); }

        @media (max-width: 480px) {
            .cine-brand-main { font-size: 1.4rem; letter-spacing: 3px; }
            .cine-brand-tag { font-size: 0.6rem; letter-spacing: 5px; }
            .cine-logo-wrap { width: 140px; height: 140px; }
            .cine-brand { top: calc(50% + 105px); }
            .login-card { padding: 32px 22px 28px; }
            .login-title { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════ CINEMATIC INTRO ═══════════════ -->
    <div id="cinemaIntro">
        <div class="cine-grid"></div>
        <div class="cine-scan"></div>
        <div class="cine-line"></div>

        <svg class="cine-bolts" viewBox="0 0 400 800" preserveAspectRatio="none">
            <path class="cine-bolt b1" d="M 50 0 L 30 100 L 70 100 L 25 220 L 60 220 L 15 360 L 50 360"/>
            <path class="cine-bolt b2" d="M 350 50 L 320 160 L 360 160 L 310 300 L 350 300 L 300 450"/>
            <path class="cine-bolt b3" d="M 200 500 L 180 600 L 220 600 L 180 720 L 210 720 L 170 800"/>
        </svg>

        <div class="cine-particles" id="cineParticles"></div>

        <div class="cine-logo-wrap">
            <div class="cine-ring-1"></div>
            <div class="cine-ring-2"></div>
            <div class="cine-ring-3"></div>
            <div class="cine-logo">
                <img src="https://raw.githubusercontent.com/Blackn1te-crypto/BLACKN1TE-NXS/main/logo.png" alt="BL@CKN1TE-NXS">
            </div>
        </div>

        <div class="cine-brand">
            <div class="cine-brand-main">BL@CKN1TE-NXS-ULTRA</div>
            <div class="cine-brand-tag">SECURE ACCESS</div>
            <div class="cine-brand-sub">THE INCISIVE TRI-HAT HACKER</div>
        </div>

        <div class="cine-loader">
            <div class="cine-loader-label" id="cineLoaderLabel">INITIALIZING CORE</div>
            <div class="cine-loader-track">
                <div class="cine-loader-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ═══════════════ LOGIN SCREEN ═══════════════ -->
    <div id="loginScreen">
        <div class="login-bg"></div>
        <div class="login-grid"></div>

        <div class="login-card">
            <div class="login-logo-wrap">
                <div class="login-logo-ring"></div>
                <div class="login-logo">
                    <img src="https://raw.githubusercontent.com/Blackn1te-crypto/BLACKN1TE-NXS/main/logo.png" alt="Logo">
                </div>
            </div>

            <h1 class="login-title">BL@CKN1TE-NXS</h1>
            <p class="login-sub">ULTRA ACCESS TERMINAL</p>

            <div class="login-error" id="loginError">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="loginErrorText">Invalid credentials</span>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="input-field">
                    <label>Username</label>
                    <div class="input-wrap">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="Enter operator ID" autocomplete="username" spellcheck="false">
                    </div>
                </div>

                <div class="input-field">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter access key" autocomplete="current-password">
                        <span class="input-toggle" id="togglePass"><i class="fas fa-eye"></i></span>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-bolt"></i>
                    <span>ENTER ULTRA</span>
                </button>
            </form>

            <div class="login-footer">
                <div class="tagline">POWERED BY BL@CKN1TE</div>
                <div>© 2026 · THE INCISIVE TRI-HAT HACKER</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ═══════════════ PARTICLES ═══════════════
            (function spawnParticles() {
                const wrap = document.getElementById('cineParticles');
                if (!wrap) return;
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (4 + Math.random() * 5) + 's';
                    p.style.animationDelay = (Math.random() * 4) + 's';
                    const colors = ['#00ff9d', '#06b6d4', '#7c3aed'];
                    const c = colors[Math.floor(Math.random() * colors.length)];
                    p.style.background = c;
                    p.style.boxShadow = `0 0 10px ${c}, 0 0 20px ${c}`;
                    wrap.appendChild(p);
                }
            })();

            // ═══════════════ LOADER LABEL ROTATION ═══════════════
            const loadingMessages = [
                'INITIALIZING CORE',
                'LOADING NEXUS ENGINE',
                'VERIFYING AUTH',
                'ESTABLISHING LINK',
                'ULTRA READY'
            ];
            let msgIdx = 0;
            const loaderLabel = document.getElementById('cineLoaderLabel');
            const loaderTimer = setInterval(() => {
                msgIdx++;
                if (msgIdx < loadingMessages.length && loaderLabel) {
                    loaderLabel.innerText = loadingMessages[msgIdx];
                }
                if (msgIdx >= loadingMessages.length) clearInterval(loaderTimer);
            }, 700);

            // ═══════════════ INTRO → LOGIN TRANSITION ═══════════════
            setTimeout(() => {
                const intro = document.getElementById('cinemaIntro');
                const login = document.getElementById('loginScreen');
                intro.classList.add('hide');
                setTimeout(() => {
                    login.classList.add('show');
                    setTimeout(() => document.getElementById('username')?.focus(), 400);
                }, 500);
            }, 5400);

            // ═══════════════ TOAST ═══════════════
            function showToast(message, type = 'info', duration = 4000) {
                const c = document.getElementById('toastContainer');
                if (!c) return;
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${message}</span>`;
                c.appendChild(t);
                setTimeout(() => {
                    t.style.opacity = '0';
                    t.style.transform = 'translateX(100%)';
                    t.style.transition = '0.3s';
                    setTimeout(() => t.remove(), 300);
                }, duration);
            }

            // ═══════════════ PASSWORD TOGGLE ═══════════════
            document.getElementById('togglePass')?.addEventListener('click', function () {
                const pwd = document.getElementById('password');
                const icon = this.querySelector('i');
                if (pwd.type === 'password') {
                    pwd.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    pwd.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });

            // ═══════════════ LOGIN (SERVER-SIDE) ═══════════════
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const loginErrorText = document.getElementById('loginErrorText');

            function showError(msg) {
                loginErrorText.innerText = msg;
                loginError.classList.add('show');
                loginForm.classList.add('shake');
                setTimeout(() => loginForm.classList.remove('shake'), 500);
            }

            function hideError() {
                loginError.classList.remove('show');
            }

            loginForm?.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const username = document.getElementById('username').value.trim().toLowerCase();
                const password = document.getElementById('password').value;

                if (!username) return showError('Enter your operator ID');
                if (!password) return showError('Enter your access key');

                loginBtn.disabled = true;
                loginBtn.querySelector('span').innerText = 'VERIFYING...';

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();

                    if (data.success) {
                        const session = {
                            user: data.user,
                            timestamp: data.timestamp,
                            token: data.token,
                            verifiedToken: data.token
                        };
                        try {
                            localStorage.setItem('nexusAuth', JSON.stringify(session));
                            sessionStorage.setItem('nexusAuth', JSON.stringify(session));
                        } catch (e) {}

                        showToast('Access granted · welcome ULTRA', 'success', 2500);
                        loginBtn.querySelector('span').innerText = 'ACCESS GRANTED';
                        loginBtn.style.background = 'linear-gradient(135deg, #00ff9d, #00cc7a)';

                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 900);
                    } else {
                        loginBtn.disabled = false;
                        loginBtn.querySelector('span').innerText = 'ENTER ULTRA';
                        showError(data.error || 'Invalid operator ID or access key');
                    }
                } catch (err) {
                    loginBtn.disabled = false;
                    loginBtn.querySelector('span').innerText = 'ENTER ULTRA';
                    showError('Server unreachable · try again');
                }
            });

            // ═══════════════ AUTO-REDIRECT IF LOGGED IN ═══════════════
            try {
                const SESSION_KEY = 'nexusAuth';
                const SESSION_TTL = 30 * 60 * 1000;
                const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
                if (raw) {
                    const s = JSON.parse(raw);
                    if (s.timestamp && (Date.now() - s.timestamp < SESSION_TTL)) {
                        setTimeout(() => {
                            window.location.replace('/index.html');
                        }, 500);
                    }
                }
            } catch (e) {}

            console.log('%cBL@CKN1TE-NXS-ULTRA · LOGIN TERMINAL', 'color:#00ff9d; font-family:Orbitron; font-size:14px; font-weight:900; text-shadow:0 0 10px #00ff9d;');
        })();
    </script>
</body>
